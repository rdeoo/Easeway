services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: easeway
      POSTGRES_USER: easeway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easeway -d easeway"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
